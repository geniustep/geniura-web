# Continuous integration for geniura-web. It never deploys anything and uses no secrets.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches the pinned contract
        run: |
          pnpm api:generate
          git diff --exit-code -- lib/api/generated
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Logical CSS (RTL safety)
        run: pnpm check:css
      - name: Message catalogs aligned
        run: pnpm check:messages
      - name: Unit and component tests
        run: pnpm test
      - name: Build (includes type checking)
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    env:
      NEXT_PUBLIC_ENABLE_GUEST_CV: "true"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end, accessibility and header checks (desktop + mobile)
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  guest-workspace-e2e:
    env:
      NEXT_PUBLIC_ENABLE_GUEST_CV: "true"
      NEXT_PUBLIC_ENABLE_GUEST_DRAFT_WORKSPACE: "true"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end, accessibility and header checks (desktop + mobile)
        run: pnpm exec playwright test tests/e2e/guest-workspace.spec.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-workspace-playwright-report
          path: playwright-report
          retention-days: 7
