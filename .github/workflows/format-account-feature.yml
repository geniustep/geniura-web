name: format-account-feature

on:
  push:
    branches:
      - feat/account-settings-journey-20261019

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/account-settings-journey-20261019
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format account feature files
        run: pnpm exec prettier --write 'app/[locale]/account/page.tsx' features/account/account-settings.tsx features/account/notification-preferences.tsx tests/integration/account-settings.spec.ts
      - name: Commit formatted feature files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/[locale]/account/page.tsx' features/account/account-settings.tsx features/account/notification-preferences.tsx tests/integration/account-settings.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(account): apply repository Prettier rules"
            git push origin HEAD:feat/account-settings-journey-20261019
          fi
