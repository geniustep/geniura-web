# Temporary, source-controlled, one-shot formatter for the CV review table.
# Scoped to dev and one file; remove immediately after running.
name: cv-review-one-shot-format
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/cv-review-one-shot-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write features/profile/extraction-review.tsx
      - name: Commit the formatter-only change to dev
        run: |
          if ! git diff --quiet -- features/profile/extraction-review.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add features/profile/extraction-review.tsx
            git commit -m 'style(cv): apply Prettier to grouped review table'
            git push origin HEAD:dev
          fi
