name: CV contract formatter (temporary branch-only)

on:
  push:
    branches:
      - feat/partial-dates-ui
    paths:
      - .github/workflows/cv-contract-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format contract and update source checksum
        run: |
          pnpm exec prettier --write contracts/openapi.web.v1.yaml
          node --input-type=module -e '
            import fs from "node:fs";
            import crypto from "node:crypto";
            const file = "contracts/openapi.web.v1.yaml";
            const meta = "contracts/source.json";
            const value = JSON.parse(fs.readFileSync(meta, "utf8"));
            value.outputSha256 = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            fs.writeFileSync(meta, JSON.stringify(value, null, 2) + "\n");
          '
          pnpm exec prettier --write contracts/source.json
          pnpm api:generate
          git add -A -- contracts/openapi.web.v1.yaml contracts/source.json lib/api/generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "style(api): format public CV contract and verify generated client"
            git push origin HEAD:refs/heads/feat/partial-dates-ui
          fi
