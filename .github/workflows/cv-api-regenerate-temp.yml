name: CV API client regeneration (temporary branch-only)

on:
  push:
    branches:
      - feat/partial-dates-ui
    paths:
      - .github/workflows/cv-api-regenerate-temp.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate from the reviewed public CV schema overlay
        run: pnpm api:generate
      - name: Format period forms and focused unit tests
        run: pnpm exec prettier --write features/profile/periods.ts features/profile/extraction-review.tsx tests/unit/profile-periods.test.ts
      - name: Update public snapshot checksum
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import crypto from "node:crypto";
            const file = "contracts/openapi.web.v1.yaml";
            const jsonFile = "contracts/source.json";
            const metadata = JSON.parse(fs.readFileSync(jsonFile, "utf8"));
            metadata.outputSha256 = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            fs.writeFileSync(jsonFile, JSON.stringify(metadata, null, 2) + "\n");
          '
          pnpm exec prettier --write contracts/source.json
      - name: Commit generated files to this isolated branch only
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "feat/partial-dates-ui"
          git add -A -- contracts/source.json lib/api/generated features/profile/periods.ts features/profile/extraction-review.tsx tests/unit/profile-periods.test.ts
          if git diff --cached --quiet; then
            echo "Generated client is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(api): regenerate CV profile client from reviewed backend schema"
          git push origin HEAD:refs/heads/feat/partial-dates-ui
