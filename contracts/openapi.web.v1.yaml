openapi: 3.0.3
info:
  title: Geniura API
  version: 1.0.0-dev
  description: |-
    Geniura backend API v1 (development build). Authentication uses HttpOnly session cookies plus CSRF header for unsafe methods. Errors follow {code, message, details, request_id}.

    Web copy: staff/audit paths removed and verified corrections applied (see contracts/overrides.json). Source: geniura-api@5b14e360eec32b308d6b52b4eadb7cbf89957e22.
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the host-scoped CSRF cookie and returns a masked csrf_token in JSON. Cross-origin SPAs send this value in X-CSRFToken with credentials included.
      tags:
        - Auth
      security:
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
          description: ""
        default:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
