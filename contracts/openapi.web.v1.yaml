          maxLength: 200
        issuer:
          type: string
          maxLength: 200
        skill:
          type: string
          format: uuid
          nullable: true
        issued_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
          nullable: true
