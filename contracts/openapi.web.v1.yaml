        available_from:
          type: string
          format: date
          nullable: true
        desired_contract_types:
          type: array
          items:
            $ref: "#/components/schemas/ContractTypeEnum"
        desired_work_modes:
          type: array
          items:
            $ref: "#/components/schemas/WorkModeEnum"
        target_occupations:
          type: array
          items:
            type: string
            format: uuid
        visibility:
