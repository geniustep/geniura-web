components:
  schemas:
    AccessLog:
      type: object
      properties:
        organization_activity_visible:
          type: boolean
          description: False while organization openings and downloads are not shared with candidates (feature flag).
        summary:
          $ref: "#/components/schemas/AccessLogSummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/AccessLogEvent"
      required:
        - events
        - organization_activity_visible
        - summary
    AccessLogEvent:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/AccessLogEventKindEnum"
        occurred_at:
          type: string
          format: date-time
        organization_name:
          type: string
        job_title:
          type: string
        application_id:
          type: string
          format: uuid
          nullable: true
        resume_id:
          type: string
          format: uuid
          nullable: true
        share_request_id:
          type: string
          format: uuid
          nullable: true
        consent_id:
          type: string
          format: uuid
          nullable: true
        item_type:
          type: string
          nullable: true
        item_id:
          type: string
          format: uuid
          nullable: true
      required:
        - application_id
        - consent_id
        - item_id
        - item_type
        - job_title
        - kind
        - occurred_at
        - organization_name
        - resume_id
        - share_request_id
    AccessLogEventKindEnum:
      enum:
        - application_submitted
        - application_withdrawn
        - application_viewed
        - resume_downloaded
        - share_requested
        - share_accepted
        - share_declined
        - share_expired
        - share_revoked
        - item_verified
      type: string
      description: |-
        * `application_submitted` - application_submitted
        * `application_withdrawn` - application_withdrawn
        * `application_viewed` - application_viewed
        * `resume_downloaded` - resume_downloaded
        * `share_requested` - share_requested
        * `share_accepted` - share_accepted
        * `share_declined` - share_declined
        * `share_expired` - share_expired
        * `share_revoked` - share_revoked
        * `item_verified` - item_verified
    AccessLogSummary:
      type: object
      properties:
        organizations_with_access:
          type: integer
        resume_downloads:
          type: integer
        share_requests_pending:
          type: integer
      required:
        - organizations_with_access
        - resume_downloads
        - share_requests_pending
    ActionEnum:
      enum:
        - confirm
        - correct
        - dismiss
        - update_existing
      type: string
      description: |-
        * `confirm` - confirm
        * `correct` - correct
        * `dismiss` - dismiss
        * `update_existing` - update_existing
    ApplicantMatch:
      type: object
      properties:
        application_id:
          type: string
          format: uuid
        status:
          type: string
        candidate_name:
          type: string
        match:
          $ref: "#/components/schemas/MatchResult"
      required:
        - application_id
        - candidate_name
        - match
        - status
    ApplicantMatchList:
      type: object
      properties:
        engine_version:
          type: string
        decision_support_only:
          type: boolean
        count:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/ApplicantMatch"
      required:
        - count
        - decision_support_only
        - engine_version
        - results
    ApplicationEventKindEnum:
      enum:
        - submitted
        - transition
        - withdrawn
        - viewed
        - interview
      type: string
      description: |-
        * `submitted` - Submitted
        * `transition` - Transition
        * `withdrawn` - Withdrawn
        * `viewed` - Viewed
        * `interview` - Interview
    ApplicationPreview:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        shared_data:
          description: Exact snapshot to be shared
      required:
        - job_id
        - shared_data
    ApplicationSourceEnum:
      enum:
        - direct
        - recruitment_order
      type: string
      description: |-
        * `direct` - Direct
        * `recruitment_order` - Recruitment Order
    ApplicationStatusEnum:
      enum:
        - submitted
        - in_review
        - shortlisted
        - interview
        - offer
        - hired
        - rejected
        - withdrawn
        - closed
      type: string
      description: |-
        * `submitted` - Submitted
        * `in_review` - In Review
        * `shortlisted` - Shortlisted
        * `interview` - Interview
        * `offer` - Offer
        * `hired` - Hired
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
        * `closed` - Closed
    ApplyRequestRequest:
      type: object
      description: Rejects unknown input keys (protection against mass assignment and silent typos).
      properties:
        resume_id:
          type: string
          format: uuid
          nullable: true
        cover_letter:
          type: string
          default: ""
          maxLength: 5000
    AssessmentSessionOutcomeEnum:
      enum:
        - not_assessed
        - passed
        - not_passed
        - inconclusive
      type: string
      description: |-
        * `not_assessed` - Not Assessed
        * `passed` - Passed
        * `not_passed` - Not Passed
        * `inconclusive` - Inconclusive
    AssessmentSessionStatusEnum:
      enum:
        - draft
        - scheduled
        - in_progress
        - submitted
        - reviewed
        - void
      type: string
      description: |-
        * `draft` - Draft
        * `scheduled` - Scheduled
        * `in_progress` - In Progress
        * `submitted` - Submitted
        * `reviewed` - Reviewed
        * `void` - Void
    CandidateApplication:
      type: object
      description: "What the candidate sees: no internal reasons, no organization notes."
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          allOf:
            - $ref: "#/components/schemas/_JobRef"
          readOnly: true
        status:
          allOf:
            - $ref: "#/components/schemas/ApplicationStatusEnum"
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resume:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        cover_letter:
          type: string
          readOnly: true
        snapshot:
          readOnly: true
      required:
        - cover_letter
        - id
        - job
        - resume
        - snapshot
        - status
        - status_changed_at
        - submitted_at
        - withdrawn_at
    CandidateApplicationDetail:
      type: object
      description: "What the candidate sees: no internal reasons, no organization notes."
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          allOf:
            - $ref: "#/components/schemas/_JobRef"
          readOnly: true
        status:
          allOf:
            - $ref: "#/components/schemas/ApplicationStatusEnum"
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resume:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        cover_letter:
          type: string
          readOnly: true
        snapshot:
          readOnly: true
        timeline:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
        - cover_letter
        - id
        - job
        - resume
        - snapshot
        - status
        - status_changed_at
        - submitted_at
        - timeline
        - withdrawn_at
    CandidateAssessment:
      type: object
      description: "What the candidate may see: no assessor notes, no organization summary, scores only once shared."
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        method:
          type: string
        measurement_basis:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/AssessmentSessionStatusEnum"
          readOnly: true
        scheduled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        outcome:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
      required:
        - id
        - measurement_basis
        - method
        - outcome
        - scheduled_at
        - status
        - summary
        - title
    CandidateProfile:
      type: object
      description: Rejects unknown input keys (protection against mass assignment and silent typos).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        headline:
          type: string
          maxLength: 160
        summary:
          type: string
          maxLength: 3000
        city:
