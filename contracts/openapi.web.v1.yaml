        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: "#/components/schemas/CertificationKindEnum"
        name:
          type: string
          maxLength: 200
        issuer:
          type: string
          maxLength: 200
        skill:
          type: string
          format: uuid
          nullable: true
        issued_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
          nullable: true
        source:
          allOf:
            - $ref: "#/components/schemas/ProvenanceSourceEnum"
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        verification_method:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - id
        - name
        - source
        - updated_at
        - verification_method
        - verified_at
    CertificationKindEnum:
      enum:
        - certificate
        - license
      type: string
      description: |-
